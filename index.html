<!DOCTYPE html>
<html lang="es" data-theme="tinta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walter Zuñiga Lineros — Ingeniero de Software y Datos · AgTech</title>
<meta name="description" content="Walter Zuñiga Lineros — Ingeniero de software y datos en AgTech. Arquitectura analítica end-to-end sobre Microsoft Fabric, plataformas full-stack en planta y campo, y Business Intelligence para la agroindustria exportadora chilena.">
<meta name="theme-color" content="#100e10">
<meta property="og:title" content="Walter Zuñiga Lineros — Ingeniero de Software y Datos · AgTech">
<meta property="og:description" content="Construyo el software que produce el dato y luego modelo ese dato hasta convertirlo en decisión. Casi cinco años integrando la cadena de valor de una exportadora en una sola fuente de verdad.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23e5202e'/><text x='16' y='24' text-anchor='middle' font-family='Impact,Haettenschweiler,sans-serif' font-size='20' fill='%23f4efe4'>WZ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Noto+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&text=%E3%82%A6%E3%82%A9%E3%83%AB%E3%82%BF%E3%83%BC%E9%80%B1%E5%88%8A&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#100e10; --ink2:#1a171b; --ink3:#25212a; --line:#3a343d;
  --paper:#f4efe4; --dim:#c9c2b4; --mut:#8f877a;
  --red:#e5202e; --redtxt:#ff4d59; --yel:#f6c343; --yeltxt:#f6c343; --cyan:#35b6e6;
  --on-yel:#111; --on-cyan:#0b1014;
  --disp:'Anton','Noto Sans JP',Impact,Haettenschweiler,sans-serif;
  --kana:'Noto Sans JP','Noto Sans',system-ui,sans-serif;
  --sans:'Noto Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --m:1;
  --shell:1280px;
  --bar-h:64px;
}
[data-theme="papel"]{
  color-scheme:light;
  --ink:#f4efe4; --ink2:#fbf7ee; --ink3:#e8e1d2; --line:#cfc6b4;
  --paper:#141114; --dim:#4a4540; --mut:#6f685e;
  --red:#c8121f; --redtxt:#b40f1b; --yel:#f6c343; --yeltxt:#6b4e00; --cyan:#0b6f96;
  --on-yel:#111; --on-cyan:#f4efe4;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body.is-locked{overflow:hidden}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:var(--cyan);text-decoration:none;border-bottom:2px solid transparent;transition:border-color .2s,color .2s}
a:hover{color:var(--yeltxt);border-bottom-color:var(--yeltxt)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
::selection{background:var(--red);color:var(--paper)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--line);border:3px solid var(--ink)}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0;text-wrap:pretty}
ul,ol{margin:0;padding:0;list-style:none}

@keyframes pageIn{from{opacity:0;transform:translateX(40px) skewX(-4deg)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-14deg)}70%{transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
@keyframes popIn{0%{opacity:0;transform:scale(.6) translateY(-14px)}70%{transform:scale(1.03)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes slam{0%{opacity:0;transform:scale(1.6) skewX(var(--skew,0deg));letter-spacing:.2em}100%{opacity:1;transform:skewX(var(--skew,0deg));letter-spacing:0}}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  html{scroll-behavior:auto}
}

.skip{
  position:absolute;left:12px;top:-60px;z-index:200;
  background:var(--yel);color:var(--on-yel);padding:10px 16px;
  font-weight:900;border:3px solid var(--on-yel);border-bottom-width:3px;
  transition:top .15s;
}
.skip:focus{top:12px;color:var(--on-yel)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bar{
  position:sticky;top:0;z-index:40;
  display:grid;grid-template-columns:auto auto minmax(0,1fr);
  background:var(--ink);border-bottom:4px solid var(--paper);
}
.brand{
  display:flex;align-items:center;gap:14px;
  padding:0 34px 0 18px;
  background:var(--red);color:#f4efe4;
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);
  min-height:var(--bar-h);
}
.brand-mark{font-family:var(--disp);font-size:34px;line-height:1;letter-spacing:-.02em;transform:skewX(-6deg)}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-kicker{font-family:var(--kana);font-size:10.5px;letter-spacing:.24em;font-weight:900;text-transform:uppercase}
.brand-name{font-family:var(--disp);font-size:18px;letter-spacing:.04em;text-transform:uppercase}

.tools{display:flex;align-items:center;gap:8px;padding:8px 14px}
.tool{
  height:38px;min-width:42px;padding:0 12px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:2px solid var(--paper);background:transparent;color:var(--paper);
  font-family:var(--mono);font-size:12px;cursor:pointer;
  transition:background .15s,color .15s;
}
.tool:hover{background:var(--paper);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}
.tool-glyph{font-size:15px}

.pages{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page-link{
  flex:1 0 auto;min-height:var(--bar-h);
  display:flex;flex-direction:column;justify-content:center;gap:1px;
  padding:4px clamp(10px,1.4vw,18px);
  border:none;border-left:2px solid var(--line);
  background:transparent;color:var(--dim);
  cursor:pointer;text-align:left;
  transition:background .2s,color .2s;
}
.page-link:hover{background:var(--ink3);color:var(--paper)}
.page-link[aria-current="page"]{background:var(--red);color:#f4efe4}
.page-num{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;opacity:.8}
.page-name{font-family:var(--disp);font-size:clamp(14px,1.3vw,17px);letter-spacing:.06em;text-transform:uppercase}

main{
  flex:1;position:relative;outline:none;
  overflow-x:hidden;overflow-x:clip;
  background-image:radial-gradient(circle,rgba(244,239,228,.07) 1px,transparent 1.6px);
  background-size:9px 9px;
}
[data-theme="papel"] main{background-image:radial-gradient(circle,rgba(20,17,20,.08) 1px,transparent 1.6px)}
.sheet{
  max-width:var(--shell);margin:0 auto;padding:40px 28px 60px;
  animation:pageIn calc(.55s * var(--m)) cubic-bezier(.2,.8,.2,1) both;
}
.sheet--narrow{max-width:1100px}
.sheet-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--yeltxt)}
.title{margin-top:6px;font-family:var(--disp);font-size:clamp(40px,6vw,72px);line-height:.95;text-transform:uppercase}
.lede{max-width:46ch;color:var(--dim);font-size:14.5px}

.cover{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:36px;align-items:stretch}
.cover-copy{display:flex;flex-direction:column;justify-content:center;gap:22px;min-width:0}
.cover-meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--yeltxt)}
.issue{background:var(--yel);color:var(--on-yel);padding:3px 8px;font-weight:700}
.name{
  font-family:var(--disp);font-size:clamp(56px,9vw,128px);line-height:.92;
  letter-spacing:-.01em;text-transform:uppercase;display:flex;flex-direction:column;
}
.name span{animation:slam calc(.5s * var(--m)) both}
.name span:nth-child(1){animation-delay:.05s}
.name span:nth-child(2){--skew:-8deg;color:var(--redtxt);animation-delay:.15s}
.name span:nth-child(3){-webkit-text-stroke:2px var(--paper);color:transparent;animation-delay:.25s}
.role{font-size:20px;font-weight:700;line-height:1.35;max-width:32ch}
.intro{font-size:16px;color:var(--dim);max-width:58ch;line-height:1.75}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.btn{
  display:inline-flex;align-items:center;gap:10px;padding:14px 22px;
  border:3px solid var(--paper);background:transparent;color:var(--paper);
  font-family:var(--disp);font-size:20px;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s,color .15s;
}
.btn--solid{background:var(--red);color:#f4efe4;box-shadow:6px 6px 0 var(--paper)}
.btn--solid:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--yel);color:#f4efe4}
.btn--solid:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--paper)}
.btn--ghost:hover{background:var(--paper);color:var(--ink)}
.hints{display:flex;flex-wrap:wrap;gap:10px 22px;font-family:var(--mono);font-size:12.5px;color:var(--mut);margin-top:8px}

.panel{
  position:relative;min-height:560px;padding:22px;
  border:4px solid var(--paper);background:var(--ink2);
  box-shadow:10px 10px 0 var(--red);overflow:hidden;
  background-image:repeating-linear-gradient(115deg,transparent 0 9px,rgba(244,239,228,.06) 9px 10px);
  display:flex;flex-direction:column;justify-content:space-between;
}
[data-theme="papel"] .panel{background-image:repeating-linear-gradient(115deg,transparent 0 9px,rgba(20,17,20,.06) 9px 10px)}
.panel-glow{position:absolute;inset:0;background:radial-gradient(circle at 70% 40%,rgba(229,32,46,.55),transparent 55%)}
.panel-kana{
  position:absolute;right:16px;top:18px;
  writing-mode:vertical-rl;font-family:var(--kana);font-weight:900;
  font-size:clamp(30px,5vw,54px);line-height:1;letter-spacing:.08em;
  color:var(--paper);opacity:.95;text-shadow:4px 4px 0 var(--red);
}
.stars{
  position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;max-width:380px;padding-right:clamp(52px,11vw,72px);
}
.star{
  --s:clamp(116px,14vw,168px);
  width:var(--s);height:var(--s);
  display:grid;place-items:center;
  clip-path:polygon(100% 50%,86.7% 59.8%,93.3% 75%,76.9% 76.9%,75% 93.3%,59.8% 86.7%,50% 100%,40.2% 86.7%,25% 93.3%,23.1% 76.9%,6.7% 75%,13.3% 59.8%,0 50%,13.3% 40.2%,6.7% 25%,23.1% 23.1%,25% 6.7%,40.2% 13.3%,50% 0,59.8% 13.3%,75% 6.7%,76.9% 23.1%,93.3% 25%,86.7% 40.2%);
  animation:pop calc(.6s * var(--m)) cubic-bezier(.2,.9,.3,1.3) both;
}
.star:nth-child(1){background:var(--yel);color:var(--on-yel);animation-delay:.3s}
.star:nth-child(2){--s:clamp(108px,13vw,152px);justify-self:end;margin-top:34px;background:#f4efe4;color:#100e10;animation-delay:.45s}
.star:nth-child(3){--s:clamp(120px,15vw,176px);background:var(--cyan);color:var(--on-cyan);animation-delay:.6s}
.star:nth-child(4){--s:clamp(102px,12vw,136px);justify-self:end;background:var(--red);color:#f4efe4;animation-delay:.75s}
.star-in{
  width:52%;height:52%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;line-height:1;
}
.star-num{font-family:var(--disp);font-size:calc(var(--s) * .3);line-height:.9}
.star-label{
  font-size:max(8px,calc(var(--s) * .062));font-weight:900;
  letter-spacing:.03em;text-transform:uppercase;line-height:1.15;
  margin-top:calc(var(--s) * .035);
}
.panel-foot{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:22px}
.panel-tags{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.quote-card{
  background:var(--paper);color:var(--ink);padding:10px 14px;
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--red);
  font-weight:700;font-size:13px;line-height:1.35;max-width:240px;transform:rotate(2deg);
}

.ticker{
  margin-top:44px;border-top:3px solid var(--paper);border-bottom:3px solid var(--paper);
  background:var(--paper);color:var(--ink);overflow:hidden;white-space:nowrap;
}
.ticker-track{display:inline-flex;animation:ticker calc(28s * var(--m)) linear infinite;will-change:transform}
.ticker-run{display:inline-flex;gap:28px;padding:10px 14px;font-family:var(--disp);font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.ticker-star{color:var(--red)}

.jump-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:36px}
.jump{
  display:flex;flex-direction:column;
  text-align:left;background:var(--ink2);border:3px solid var(--paper);
  padding:18px 20px;color:var(--paper);cursor:pointer;
  transition:transform .15s,box-shadow .15s;box-shadow:0 0 0 var(--red);
}
.jump:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--red)}
.jump-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--yeltxt);text-transform:uppercase}
.jump-title{font-family:var(--disp);font-size:26px;letter-spacing:.04em;margin:4px 0 6px}
.jump-note{font-size:13.5px;color:var(--dim)}

.shelf{
  display:flex;gap:10px;align-items:flex-end;overflow-x:auto;
  padding:14px 6px 22px;border-bottom:6px solid var(--paper);scrollbar-width:thin;
}
.spine{
  flex-shrink:0;width:96px;height:var(--h,210px);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:12px 0;border:3px solid var(--paper);
  background:var(--ink2);color:var(--paper);cursor:pointer;
  box-shadow:4px 4px 0 var(--line);
  transition:transform .2s,background .2s,color .2s,box-shadow .2s;
}
.spine:nth-child(1){--h:190px}
.spine:nth-child(2){--h:210px}
.spine:nth-child(3){--h:250px}
.spine:nth-child(4){--h:220px}
.spine:nth-child(5){--h:200px}
.spine:hover{transform:translateY(-8px)}
.spine[aria-selected="true"]{background:var(--red);color:#f4efe4;box-shadow:6px 6px 0 var(--yel)}
.spine-vol{font-family:var(--disp);font-size:24px;line-height:1}
.spine-name{writing-mode:vertical-rl;font-family:var(--disp);font-size:20px;letter-spacing:.08em;text-transform:uppercase;flex:1;display:flex;align-items:center;justify-content:center}
.spine-years{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:center;padding:0 4px}

.tome{margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;align-items:start;animation:rise calc(.4s * var(--m)) both}
.tome-panel{position:relative;border:4px solid var(--paper);background:var(--ink2);padding:26px 28px;box-shadow:8px 8px 0 var(--red)}
.tome-tag{position:absolute;top:-16px;left:20px;background:var(--yel);color:var(--on-yel);font-family:var(--disp);font-size:16px;letter-spacing:.08em;padding:3px 12px;border:3px solid var(--on-yel);transform:rotate(-2deg)}
.tome-years{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase;margin-top:8px}
.tome-title{margin:6px 0 10px;font-family:var(--disp);font-size:clamp(30px,4vw,48px);line-height:1;text-transform:uppercase}
.tome-summary{color:var(--dim);font-size:15px;line-height:1.75}
.tome-list{display:flex;flex-direction:column;gap:12px}
.tome-item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start;border:3px solid var(--paper);background:var(--ink);padding:14px 16px;transition:transform .15s}
.tome-item:hover{transform:translateX(6px)}
.tome-when{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--yeltxt);letter-spacing:.04em;padding-top:3px}
.tome-what{font-weight:700;font-size:15px}
.tome-detail{font-size:13.5px;color:var(--dim)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.filter{
  padding:7px 14px;border:2px solid var(--paper);background:transparent;color:var(--paper);
  font-family:var(--mono);font-size:12.5px;font-weight:700;cursor:pointer;
  transition:background .15s,color .15s,transform .15s;
}
.filter:hover{transform:translateY(-2px)}
.filter[aria-pressed="true"]{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}

.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;align-items:start}
.chapter{
  position:relative;text-align:left;display:flex;flex-direction:column;gap:12px;
  padding:0;border:4px solid var(--paper);background:var(--ink2);color:var(--paper);
  cursor:pointer;box-shadow:0 0 0 var(--red);
  transition:transform .2s,box-shadow .2s;
  animation:rise calc(.45s * var(--m)) both;
}
.chapter:nth-child(9n+1){transform:rotate(-1deg)}
.chapter:nth-child(9n+2){transform:rotate(.8deg)}
.chapter:nth-child(9n+3){transform:rotate(-.6deg)}
.chapter:nth-child(9n+4){transform:rotate(1deg)}
.chapter:nth-child(9n+5){transform:rotate(-1.2deg)}
.chapter:nth-child(9n+6){transform:rotate(.5deg)}
.chapter:nth-child(9n+7){transform:rotate(-.8deg)}
.chapter:nth-child(9n+8){transform:rotate(1.1deg)}
.chapter:nth-child(9n+9){transform:rotate(-.5deg)}
.chapter:hover,.chapter:focus-visible{transform:rotate(0deg) translate(-3px,-3px);box-shadow:8px 8px 0 var(--red);z-index:2}
.chapter-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:3px solid var(--paper)}
.chapter[data-badge="Ranco"] .chapter-head{background:var(--red);color:#f4efe4}
.chapter[data-badge="BI"] .chapter-head{background:var(--yel);color:var(--on-yel)}
.chapter[data-badge="Personal"] .chapter-head{background:var(--cyan);color:var(--on-cyan)}
.chapter-num{font-family:var(--disp);font-size:15px;letter-spacing:.1em}
.chapter-badge{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.chapter-thumb{margin:0 14px;border:3px solid var(--paper);height:150px;overflow:hidden;background:var(--ink)}
.chapter-thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.chapter-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.chapter-name{font-family:var(--disp);font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.chapter-domain{font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:.04em}
.chapter-key{font-size:14px;color:var(--dim);line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tag{border:2px solid var(--line);padding:2px 8px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.open-tag{position:absolute;right:-10px;bottom:-12px;background:var(--yel);color:var(--on-yel);font-family:var(--disp);font-size:14px;letter-spacing:.06em;padding:4px 10px;border:3px solid var(--on-yel);transform:rotate(-6deg)}
.empty{margin-top:30px;color:var(--dim);font-family:var(--mono)}

.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;align-items:start}
.dossier{border:4px solid var(--paper);background:var(--ink2);box-shadow:8px 8px 0 var(--cyan);overflow:hidden}
.dossier-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--paper);color:var(--ink);font-family:var(--disp);font-size:16px;letter-spacing:.1em}
.dossier-state{background:var(--red);color:#f4efe4;padding:2px 10px;font-size:13px}
.dossier-body{padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.dossier-name{font-family:var(--disp);font-size:34px;line-height:1;text-transform:uppercase}
.spec{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14px}
.spec dt{font-family:var(--mono);font-size:12px;color:var(--yeltxt);letter-spacing:.1em;text-transform:uppercase;padding-top:3px}
.spec dd{margin:0}
.moves{border-top:3px solid var(--line);padding-top:14px}
.moves-title{font-family:var(--mono);font-size:12px;color:var(--yeltxt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.moves li{display:flex;gap:10px;font-size:14px;margin-bottom:6px}
.moves li::before{content:"▶";color:var(--redtxt);font-weight:900;flex-shrink:0}
.skills{display:flex;flex-direction:column;gap:18px}
.skill{border:3px solid var(--paper);background:var(--ink);padding:16px 18px}
.skill-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.skill-name{font-family:var(--disp);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.skill-tag{font-family:var(--mono);font-size:11.5px;color:var(--cyan);letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--paper);color:var(--ink);padding:4px 10px;font-weight:700;font-size:12.5px;border:2px solid var(--paper);transition:background .15s,color .15s,border-color .15s}
.chip:hover{background:var(--red);color:#f4efe4;border-color:var(--red)}
.method{border:3px solid var(--paper);background:var(--yel);color:var(--on-yel);padding:16px 18px}
.method-title{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.method ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px;font-size:14px;font-weight:700}

.counter{display:flex;align-items:center;gap:12px;border:3px solid var(--paper);padding:8px 14px;font-family:var(--mono);font-size:13px}
.counter b{color:var(--yeltxt)}
.counter i{color:var(--cyan);font-style:normal;font-weight:700}
.log{display:flex;flex-direction:column;gap:10px}
.log-item{display:grid;grid-template-columns:44px 120px minmax(0,1fr);gap:14px;align-items:center;border:3px solid var(--paper);padding:12px 16px;animation:rise calc(.4s * var(--m)) both;transition:transform .15s}
.log-item:hover{transform:translateX(6px)}
.log-item[data-done="true"]{background:var(--ink2)}
.log-mark{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:3px solid var(--paper);font-weight:900;font-size:18px}
.log-item[data-done="true"] .log-mark{background:var(--yel);color:var(--on-yel)}
.log-item[data-done="false"] .log-mark{color:var(--cyan)}
.log-when{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--yeltxt);letter-spacing:.04em}
.log-what{font-weight:700;font-size:15px}
.log-detail{font-size:13px;color:var(--dim)}

.contact-title{margin:6px 0 24px;font-family:var(--disp);font-size:clamp(48px,9vw,120px);line-height:.9;text-transform:uppercase}
.contact-title span{color:var(--redtxt)}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;align-items:start}
.contact-card{border:4px solid var(--paper);background:var(--ink2);box-shadow:8px 8px 0 var(--red);padding:22px 24px;display:flex;flex-direction:column;gap:14px;font-size:15px}
.contact-rows{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px 14px;align-items:baseline}
.contact-rows dt{font-family:var(--mono);font-size:12px;color:var(--yeltxt);letter-spacing:.1em;text-transform:uppercase}
.contact-rows dd{margin:0;min-width:0;word-break:break-word}
.contact-cta{
  align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:12px 20px;
  background:var(--red);color:#f4efe4;border:3px solid var(--paper);box-shadow:5px 5px 0 var(--paper);
  font-family:var(--disp);font-size:18px;letter-spacing:.06em;text-transform:uppercase;
  transition:transform .15s,box-shadow .15s;
}
.contact-cta:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--yel);color:#f4efe4;border-bottom-color:var(--paper)}
.note{position:relative;border:3px solid var(--paper);background:var(--paper);color:var(--ink);padding:18px 20px}
.note-title{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.note ul{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14.5px}
.note::after{content:"";position:absolute;left:30px;bottom:-18px;width:0;height:0;border-left:16px solid transparent;border-top:18px solid var(--paper)}
.closing{font-size:15px;color:var(--dim);line-height:1.75;margin-top:14px}
.end-mark{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}

.foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;
  padding:8px 18px;border-top:3px solid var(--paper);background:var(--ink2);
  font-family:var(--mono);font-size:12px;color:var(--dim);
}
.status{display:flex;align-items:center;gap:8px}
.status::before{content:"";width:10px;height:10px;background:var(--yel);display:inline-block}
.pager{margin-left:auto;display:flex;align-items:center;gap:14px}
.pager-btn{border:2px solid var(--paper);background:transparent;color:var(--paper);width:32px;height:28px;cursor:pointer;font-family:var(--mono);transition:background .15s,color .15s}
.pager-btn:hover{background:var(--paper);color:var(--ink)}

.term{
  position:fixed;left:0;right:0;bottom:0;z-index:50;height:230px;
  display:flex;flex-direction:column;background:var(--ink);
  border-top:4px solid var(--yel);box-shadow:0 -20px 60px rgba(0,0,0,.5);
  animation:rise calc(.3s * var(--m)) both;
}
.term-head{display:flex;align-items:center;gap:16px;padding:8px 18px;border-bottom:2px solid var(--line);font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.term-head b{color:var(--yeltxt)}
.term-close{margin-left:auto;border:2px solid var(--paper);background:transparent;color:var(--paper);width:28px;height:24px;cursor:pointer;font-family:var(--mono)}
.term-close:hover{background:var(--red);border-color:var(--red);color:#f4efe4}
.term-body{flex:1;overflow-y:auto;padding:10px 18px 14px;font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--dim)}
.term-line{display:flex;gap:10px;white-space:pre-wrap}
.term-line b{color:var(--yeltxt);flex-shrink:0;font-weight:400}
.term-line[data-tone="in"] span{color:var(--paper)}
.term-line[data-tone="err"] span{color:var(--redtxt)}
.term-line[data-tone="ok"] span{color:var(--yeltxt)}
.term-line[data-tone="mut"] span{color:var(--mut)}
.term-row{display:flex;gap:10px;align-items:center;margin-top:2px}
.term-row label{color:var(--yeltxt);flex-shrink:0}
.term-row input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--paper);font-family:var(--mono);font-size:13px;padding:4px 0}

.backdrop{position:fixed;inset:0;background:rgba(8,6,9,.8);display:flex;justify-content:center;animation:fade calc(.18s * var(--m)) both}
[data-theme="papel"] .backdrop{background:rgba(60,52,40,.55)}
.pal-backdrop{z-index:70;align-items:flex-start;padding:80px 20px 20px;backdrop-filter:blur(3px)}
.pal{width:640px;max-width:100%;background:var(--ink2);border:4px solid var(--paper);box-shadow:10px 10px 0 var(--red);animation:popIn calc(.3s * var(--m)) cubic-bezier(.2,.8,.3,1.2) both}
.pal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:3px solid var(--paper)}
.pal-head input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--paper);font-family:var(--mono);font-size:14px}
.pal-esc{border:2px solid var(--paper);background:transparent;color:var(--paper);padding:3px 8px;font-family:var(--mono);font-size:11px;cursor:pointer}
.pal-esc:hover{background:var(--paper);color:var(--ink)}
.pal-list{max-height:360px;overflow-y:auto;padding:8px}
.pal-item{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;font-size:14px;min-width:0;border:2px solid transparent;color:var(--paper)}
.pal-item[aria-selected="true"]{background:var(--red);color:#f4efe4;border-color:var(--paper)}
.pal-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border:2px solid currentColor;opacity:.85;flex-shrink:0}
.pal-label{font-weight:700;flex-shrink:0}
.pal-sub{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px;opacity:.7}
.pal-empty{padding:18px 12px;font-family:var(--mono);font-size:13px;color:var(--dim)}

.modal-backdrop{z-index:60;align-items:flex-start;padding:30px 16px;overflow-y:auto}
.modal{width:1000px;max-width:100%;background:var(--ink2);border:4px solid var(--paper);box-shadow:12px 12px 0 var(--red);animation:popIn calc(.35s * var(--m)) cubic-bezier(.2,.8,.3,1.15) both;outline:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:4px solid var(--paper);background:var(--paper);color:var(--ink);position:sticky;top:0;z-index:1}
.modal-head span{font-family:var(--disp);font-size:16px;letter-spacing:.1em}
.modal-close{border:3px solid var(--ink);background:var(--ink);color:var(--paper);width:34px;height:30px;cursor:pointer;font-family:var(--mono);font-weight:700}
.modal-close:hover{background:var(--red);border-color:var(--red);color:#f4efe4}
.modal-body{padding:26px 28px 30px;display:flex;flex-direction:column;gap:22px}
.modal-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;align-items:start}
.modal-intro{display:flex;flex-direction:column;gap:12px;min-width:0}
.modal-domain{font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:.08em}
.modal-name{font-family:var(--disp);font-size:clamp(34px,5vw,60px);line-height:.95;text-transform:uppercase}
.modal-summary{font-size:15px;color:var(--dim);line-height:1.75}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stack span{background:var(--paper);color:var(--ink);padding:3px 9px;font-weight:700;font-size:12.5px}
.modal-link{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:3px solid var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:12.5px;font-weight:700}
.modal-link:hover{background:var(--cyan);color:var(--ink);border-bottom-color:var(--cyan)}
.key-card{position:relative;background:var(--yel);color:var(--on-yel);padding:20px 22px 22px;border:3px solid var(--on-yel);transform:rotate(-1deg)}
.key-card-title{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.key-card-text{font-family:var(--disp);font-size:clamp(22px,2.6vw,30px);line-height:1.1;text-transform:uppercase}
.key-card::after{content:"";position:absolute;left:40px;bottom:-20px;width:0;height:0;border-right:18px solid transparent;border-top:20px solid var(--yel)}
.block-title{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--yeltxt)}
.block{display:flex;flex-direction:column;gap:10px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.shot{margin:0;border:3px solid var(--paper);background:var(--ink);display:flex;flex-direction:column}
.shot img{width:100%;height:200px;object-fit:cover;object-position:top}
.shot figcaption{padding:8px 10px;font-size:12.5px;color:var(--dim);border-top:3px solid var(--paper)}
.index{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 26px}
.index-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:9px 0;border-top:2px solid var(--line)}
.index-num{font-family:var(--mono);font-size:11px;color:var(--yeltxt);padding-top:5px}
.index-name{display:block;font-family:var(--disp);font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.index-desc{display:block;font-size:13px;color:var(--dim);line-height:1.55;margin-top:2px}
.decisions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.decision{border:3px solid var(--line);padding:12px 14px;background:var(--ink)}
.decision-title{font-weight:700;font-size:14px;margin-bottom:4px}
.decision-text{font-size:13px;color:var(--dim);line-height:1.6}
.pull-quote{margin:0;border-left:6px solid var(--red);padding:6px 0 6px 18px;font-size:17px;font-weight:700;line-height:1.5;max-width:60ch}
.modal-nav{display:flex;justify-content:space-between;gap:10px;border-top:3px solid var(--line);padding-top:14px}
.modal-nav button{border:2px solid var(--paper);background:transparent;color:var(--paper);padding:8px 14px;cursor:pointer;font-family:var(--mono);font-size:12.5px;transition:background .15s,color .15s}
.modal-nav button:hover{background:var(--paper);color:var(--ink)}

@media (max-width:900px){
  :root{--bar-h:52px}
  .bar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand tools" "nav nav"}
  .brand{grid-area:brand;padding-right:28px}
  .tools{grid-area:tools}
  .pages{grid-area:nav;border-top:2px solid var(--line)}
  .page-link{flex:0 0 auto;min-height:44px;flex-direction:row;align-items:baseline;gap:7px;padding:0 14px}
  .page-link:first-child{border-left:none}
  .page-name{font-size:15px}
  .brand-mark{font-size:26px}
  .brand-name{font-size:15px}
  .brand-kicker{font-size:9.5px;letter-spacing:.18em}
  .sheet{padding:28px 18px 48px}
  .panel{min-height:440px;padding:18px}
  .stars{gap:10px;padding-right:clamp(44px,14vw,64px)}
  .star:nth-child(2){margin-top:24px}
  .tome-item{grid-template-columns:76px minmax(0,1fr);gap:10px}
  .log-item{grid-template-columns:36px 92px minmax(0,1fr);gap:10px;padding:10px 12px}
  .spec,.contact-rows{grid-template-columns:1fr;gap:2px 0}
  .spec dt,.contact-rows dt{padding-top:8px}
  .modal-body{padding:20px 18px 24px}
  .term{height:min(60vh,260px)}
  .pal-backdrop{padding:40px 12px 12px}
}
@media (max-width:520px){
  .tools{padding:6px 10px;gap:6px}
  .tool{height:34px;min-width:38px;padding:0 9px;font-size:11px}
  .name{font-size:clamp(44px,13vw,72px)}
  .cta-row .btn{flex:1 1 100%;justify-content:center}
  .quote-card{max-width:100%;transform:none}
  .shots{grid-template-columns:1fr 1fr}
  .shot img{height:130px}
  .modal-nav{flex-direction:column}
  .modal-nav button{width:100%}
}
</style>
</head>

     {t:'Un reporte que oculta lo que pasó es peor que no tener reporte', d:'Un cruce interno contra una dimensión borra en silencio las detenciones cuya causal ya fue dada de baja, y un filtro que depende del campo «activo» hace desaparecer lo histórico apenas alguien limpia un catálogo. Con la temporada puesta en «todas», la grilla llegaba a perder todas las detenciones y mostrar cien por ciento de disponibilidad. Los filtros pasaron a derivarse de los hechos del propio sector, no de catálogos ajenos.'},
     {t:'Las horas pagadas de un turno se calculan en un solo lugar', d:'Siete procedimientos las calculaban por su cuenta. Uno tomaba los dos primeros caracteres de la colación, así que una colación de una hora y media valía una hora; otro restaba una colación en horas a una duración en minutos y devolvía porcentajes negativos. Hoy hay una sola función que resuelve el cruce de medianoche, descuenta la colación y no baja de cero.'},

          <ul>${INTERESES.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
        </div>
        <p class="closing">Hoy diseño plataformas propias que operan en planta y en campo, y sostengo la capa analítica que acompaña la temporada entera, desde el huerto hasta el cliente en destino. Mi enfoque no es el código por el código: es la entrega de valor real, la trazabilidad absoluta y la mejora continua del negocio. Busco conectar con empresas del ecosistema AgTech global —o corporativos que necesiten un perfil híbrido senior— donde ese puente entre ingeniería y negocio haga falta de verdad. Conversemos.</p>
        <p class="end-mark">Fin del número · continuará</p>
      </div>
    </div>
  </section>`;
}

const VIEWS = {portada:viewPortada, tomos:viewTomos, capitulos:viewCapitulos, personaje:viewPersonaje, logros:viewLogros, contacto:viewContacto};

function paint(){
  renderNav();
  main.innerHTML = VIEWS[state.page]();
  const idx = PAGES.findIndex((p) => p.id === state.page);
  pagerLabel.textContent = `Página ${idx + 1} / ${PAGES.length} · ${PAGES[idx].label}`;
}

function renderLayers(){
  layers.innerHTML = [renderTerminal(), renderPalette(), renderModal()].join('');
  btnTerm.setAttribute('aria-pressed', String(state.term));
  document.body.classList.toggle('is-locked', state.pal || Boolean(state.sel));
  const body = layers.querySelector('.term-body');
  if (body) body.scrollTop = body.scrollHeight;
}

function renderTerminal(){
  if (!state.term) return '';
  const lines = state.termLines.map((l) => `
    <div class="term-line" data-tone="${l.tone}"><b>${esc(l.prompt)}</b><span>${esc(l.text)}</span></div>`).join('');
  return `
  <div class="term" role="region" aria-label="Terminal">
    <div class="term-head">
      <b>Terminal</b><span>walter@zasshi</span>
      <button class="term-close" data-close="term" aria-label="Cerrar terminal">×</button>
    </div>
    <div class="term-body" data-focus-term>
      ${lines}
      <div class="term-row">
        <label for="term-input">walter@zasshi ~ $</label>
        <input id="term-input" autocomplete="off" spellcheck="false" placeholder="ayuda">
      </div>
    </div>
  </div>`;
}

function paletteItems(){
  const q = state.palQuery.trim().toLowerCase();
  const all = [
    ...PAGES.map((p) => ({kind:'Sección', label:p.label, sub:'ir ' + p.id, act:['page', p.id]})),
    ...PROJECTS.map((p) => ({kind:'Capítulo', label:p.nombre, sub:p.dominio, act:['project', p.id]})),
    {kind:'Comando', label:'Cambiar tema', sub: state.theme === 'tinta' ? '→ papel' : '→ tinta', act:['theme']},
    {kind:'Comando', label: state.term ? 'Cerrar terminal' : 'Abrir terminal', sub:'>_', act:['term']},
    {kind:'Comando', label:'Escribir un correo', sub:CONTACTO.email, act:['mail']}
  ];
  return q ? all.filter((i) => (i.label + ' ' + i.sub + ' ' + i.kind).toLowerCase().includes(q)) : all;
}

function renderPalette(){
  if (!state.pal) return '';
  const items = paletteItems();
  const list = items.length
    ? items.map((it, i) => `
      <div class="pal-item" role="option" aria-selected="${i === state.palIndex}" data-pal="${i}">
        <span class="pal-kind">${esc(it.kind)}</span>
        <span class="pal-label">${esc(it.label)}</span>
        <span class="pal-sub">${esc(it.sub)}</span>
      </div>`).join('')
    : '<p class="pal-empty">Nada coincide con esa búsqueda.</p>';
  return `
  <div class="backdrop pal-backdrop" data-close="pal">
    <div class="pal" role="dialog" aria-modal="true" aria-label="Buscar">
      <div class="pal-head">
        <span aria-hidden="true">⌕</span>
        <input id="pal-input" aria-label="Buscar sección, proyecto o comando" placeholder="Sección, proyecto o comando…" autocomplete="off" spellcheck="false" value="${esc(state.palQuery)}">
        <button class="pal-esc" data-close="pal">ESC</button>
      </div>
      <div class="pal-list" role="listbox" aria-label="Resultados">${list}</div>
    </div>
  </div>`;
}

function renderModal(){
  const p = projectById(state.sel);
  if (!p) return '';
  const shots = p.images ? `
    <div class="block">
      <div class="block-title">Viñetas</div>
      <div class="shots">
        ${p.images.map((im) => `
        <figure class="shot">
          <img src="${esc(im.src)}" alt="${esc(im.alt)}" loading="lazy">
          <figcaption>${esc(im.cap)}</figcaption>
        </figure>`).join('')}
      </div>
    </div>` : '';
  const modules = p.modules ? `
    <div class="block">
      <div class="block-title">${esc(p.modulesTitle || 'Módulos')}</div>
      <ol class="index">
        ${p.modules.map((m, i) => `
        <li class="index-row">
          <span class="index-num">${String(i + 1).padStart(2, '0')}</span>
          <span>
            <span class="index-name">${esc(m.n)}</span>
            <span class="index-desc">${esc(m.d)}</span>
          </span>
        </li>`).join('')}
      </ol>
    </div>` : '';
  const decisions = p.decisions ? `
    <div class="block">
      <div class="block-title">${esc(p.decisionsTitle || 'Decisiones de ingeniería')}</div>
      <div class="decisions">
        ${p.decisions.map((d) => `
        <div class="decision">
          <div class="decision-title">${esc(d.t)}</div>
          <div class="decision-text">${esc(d.d)}</div>
        </div>`).join('')}
      </div>
    </div>` : '';
  return `
  <div class="backdrop modal-backdrop" data-close="modal">
    <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-head">
        <span>CAP. ${esc(p.num)} · ${esc(p.badge)}</span>
        <button class="modal-close" data-close="modal" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-top">
          <div class="modal-intro">
            <div class="modal-domain">${esc(p.dominio)}</div>
            <h2 class="modal-name" id="modal-title">${esc(p.nombre)}</h2>
            <p class="modal-summary">${esc(p.resumen)}</p>
            <div class="stack">${p.stack.map((s) => `<span>${esc(s)}</span>`).join('')}</div>
            ${p.link ? `<a class="modal-link" href="${esc(p.link)}">${esc(p.linkText)} <span aria-hidden="true">→</span></a>` : ''}
          </div>
          <div class="key-card">
            <div class="key-card-title">Decisión clave</div>
            <div class="key-card-text">${esc(p.clave)}</div>
          </div>
        </div>
        ${shots}
        ${modules}
        ${decisions}
        ${p.quote ? `<blockquote class="pull-quote">${esc(p.quote)}</blockquote>` : ''}
        <div class="modal-nav">
          <button data-step="-1">← Capítulo anterior</button>
          <button data-step="1">Capítulo siguiente →</button>
        </div>
      </div>
    </article>
  </div>`;
}

function applyTheme(){
  document.documentElement.dataset.theme = state.theme;
  const bar = state.theme === 'tinta' ? '#100e10' : '#f4efe4';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', bar);
  try { localStorage.setItem(THEME_KEY, state.theme); } catch (e) {}
}

function goPage(id, {hash = true} = {}){
  if (!PAGES.some((p) => p.id === id)) return;
  state.page = id;
  paint();
  if (hash) writeHash();
  window.scrollTo({top:0, behavior:'auto'});
}

function writeHash(){
  const target = '#' + (state.sel || state.page);
  if (location.hash === target) return;
  try { history.replaceState(null, '', target); } catch (e) { location.hash = target; }
}

function readHash(){
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (!h) return false;
  if (PAGES.some((p) => p.id === h)) { state.sel = null; state.page = h; return true; }
  if (projectById(h)) { state.page = 'capitulos'; state.filter = 'all'; state.sel = h; return true; }
  return false;
}

let lastFocus = null;

function openProject(id){
  lastFocus = document.activeElement;
  state.sel = id;
  renderLayers();
  writeHash();
  const dialog = layers.querySelector('.modal');
  if (dialog) dialog.focus({preventScroll:true});
}

function closeProject(){
  state.sel = null;
  renderLayers();
  writeHash();
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  lastFocus = null;
}

function stepProject(delta){
  const list = visibleProjects();
  if (!list.length) return;
  const i = Math.max(0, list.findIndex((p) => p.id === state.sel));
  state.sel = list[(i + delta + list.length) % list.length].id;
  renderLayers();
  writeHash();
  const dialog = layers.querySelector('.modal');
  if (dialog) dialog.focus({preventScroll:true});
}

function stepPage(delta){
  const i = PAGES.findIndex((p) => p.id === state.page);
  goPage(PAGES[(i + delta + PAGES.length) % PAGES.length].id);
}

function openPalette(){
  lastFocus = document.activeElement;
  state.pal = true;
  state.palQuery = '';
  state.palIndex = 0;
  renderLayers();
  const input = document.getElementById('pal-input');
  if (input) input.focus();
}

function closePalette(){
  state.pal = false;
  renderLayers();
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  lastFocus = null;
}

function runPaletteItem(i){
  const it = paletteItems()[i];
  state.pal = false;
  if (!it) { renderLayers(); return; }
  const [kind, arg] = it.act;
  if (kind === 'page') { renderLayers(); goPage(arg); }
  else if (kind === 'project') { state.filter = 'all'; state.page = 'capitulos'; paint(); openProject(arg); }
  else if (kind === 'theme') { state.theme = state.theme === 'tinta' ? 'papel' : 'tinta'; applyTheme(); renderLayers(); }
  else if (kind === 'term') { state.term = !state.term; renderLayers(); focusTerm(); }
  else if (kind === 'mail') { renderLayers(); location.href = 'mailto:' + CONTACTO.email; }
}

function focusTerm(){
  const input = document.getElementById('term-input');
  if (input) input.focus();
}

function toggleTerm(){
  state.term = !state.term;
  renderLayers();
  if (state.term) focusTerm();
}

function say(lines){
  state.termLines = state.termLines.concat(lines);
}

function runCommand(raw){
  const [cmd, ...rest] = raw.trim().split(/\s+/);
  const arg = rest.join(' ').toLowerCase();
  const out = [{tone:'in', prompt:'walter@zasshi ~ $', text:raw}];
  const push = (text, tone = '') => out.push({tone, prompt:'', text});

  switch ((cmd || '').toLowerCase()) {
    case '':
      break;
    case 'ayuda': case 'help':
      push('ayuda · whoami · ls · ir <sección> · capitulos · tomos · skills · logros · contacto · tema · limpiar');
      push('Secciones: ' + PAGES.map((p) => p.id).join(', '), 'mut');
      break;
    case 'whoami':
      push('Walter Zuñiga Lineros — Ingeniero en Sistemas · Full-Stack & BI · Rancagua, Chile');
      break;
    case 'ls':
      push(PAGES.map((p) => p.num + ' ' + p.id).join('   '));
      break;
    case 'ir': {
      const p = PAGES.find((x) => x.id === arg);
      if (p) { push('→ ' + p.label, 'ok'); goPage(p.id); }
      else push('No existe la sección «' + arg + '». Prueba: ls', 'err');
      break;
    }
    case 'capitulos': case 'proyectos':
      push(PROJECTS.map((p) => 'Cap. ' + p.num + ' ' + p.nombre).join('  ·  '));
      goPage('capitulos');
      break;
    case 'tomos':
      push(TOMOS.map((t) => 'Tomo ' + t.vol + ' ' + t.spine + ' (' + t.years + ')').join('  ·  '));
      goPage('tomos');
      break;
    case 'skills':
      push(SKILLS.map((s) => s.name + ': ' + s.items.slice(0, 4).join(', ')).join(' | '));
      goPage('personaje');
      break;
    case 'logros': {
      const done = LOGROS.filter((l) => l.done).length;
      push(done + ' hitos completados, ' + (LOGROS.length - done) + ' en curso');
      goPage('logros');
      break;
    }
    case 'contacto':
      push(CONTACTO.email + ' · ' + CONTACTO.tel + ' · ' + CONTACTO.githubText);
      goPage('contacto');
      break;
    case 'tema':
      state.theme = state.theme === 'tinta' ? 'papel' : 'tinta';
      applyTheme();
      push('Tema → ' + state.theme, 'ok');
      break;
    case 'limpiar': case 'clear':
      state.termLines = [];
      renderLayers();
      return;
    default:
      push('Comando no encontrado: ' + cmd + '. Escribe «ayuda».', 'err');
  }
  say(out);
  renderLayers();
  focusTerm();
}

function trapFocus(container, e){
  const focusables = container.querySelectorAll('a[href],button,input,[tabindex]:not([tabindex="-1"])');
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === container)) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

document.addEventListener('click', (e) => {
  const closer = e.target.closest('[data-close]');
  if (closer) {
    const kind = closer.dataset.close;
    const isBackdrop = closer === e.target && closer.classList.contains('backdrop');
    const isButton = closer.tagName === 'BUTTON';
    if (isBackdrop || isButton) {
      if (kind === 'term') toggleTerm();
      if (kind === 'pal') closePalette();
      if (kind === 'modal') closeProject();
      return;
    }
  }

  const page = e.target.closest('[data-page]');
  if (page) { goPage(page.dataset.page); return; }

  const project = e.target.closest('[data-project]');
  if (project) { openProject(project.dataset.project); return; }

  const tomo = e.target.closest('[data-tomo]');
  if (tomo) { state.tomo = tomo.dataset.tomo; paint(); return; }

  const filter = e.target.closest('[data-filter]');
  if (filter) { state.filter = filter.dataset.filter; paint(); return; }

  const pal = e.target.closest('[data-pal]');
  if (pal) { runPaletteItem(Number(pal.dataset.pal)); return; }

  const step = e.target.closest('[data-step]');
  if (step) { stepProject(Number(step.dataset.step)); return; }

  if (e.target.closest('[data-focus-term]')) focusTerm();
});

document.addEventListener('mouseover', (e) => {
  const item = e.target.closest('[data-pal]');
  if (!item || !state.pal) return;
  const i = Number(item.dataset.pal);
  if (i === state.palIndex) return;
  state.palIndex = i;
  layers.querySelectorAll('[data-pal]').forEach((el) => {
    el.setAttribute('aria-selected', String(Number(el.dataset.pal) === i));
  });
});

document.addEventListener('input', (e) => {
  if (e.target.id !== 'pal-input') return;
  state.palQuery = e.target.value;
  state.palIndex = 0;
  const caret = e.target.selectionStart;
  renderLayers();
  const input = document.getElementById('pal-input');
  if (input) { input.focus(); input.setSelectionRange(caret, caret); }
});

document.addEventListener('keydown', (e) => {
  const key = (e.key || '').toLowerCase();
  const tag = (e.target.tagName || '').toLowerCase();

  if ((e.ctrlKey || e.metaKey) && key === 'p') {
    e.preventDefault();
    if (state.pal) closePalette(); else openPalette();
    return;
  }

  if (key === 'escape') {
    if (state.pal) closePalette();
    else if (state.sel) closeProject();
    else if (state.term) toggleTerm();
    return;
  }

  if (state.pal) {
    const items = paletteItems();
    if (e.key === 'Tab') { trapFocus(layers.querySelector('.pal'), e); return; }
    if (!items.length) return;
    if (key === 'arrowdown') {
      e.preventDefault();
      state.palIndex = (state.palIndex + 1) % items.length;
    } else if (key === 'arrowup') {
      e.preventDefault();
      state.palIndex = (state.palIndex - 1 + items.length) % items.length;
    } else if (key === 'enter') {
      e.preventDefault();
      runPaletteItem(state.palIndex);
      return;
    } else {
      return;
    }
    layers.querySelectorAll('[data-pal]').forEach((el) => {
      const on = Number(el.dataset.pal) === state.palIndex;
      el.setAttribute('aria-selected', String(on));
      if (on) el.scrollIntoView({block:'nearest'});
    });
    return;
  }

  if (e.target.id === 'term-input') {
    if (e.key === 'Enter') {
      const value = e.target.value;
      e.target.value = '';
      runCommand(value);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const typed = e.target.value.trim().toLowerCase();
      const match = typed && COMMANDS.find((c) => c.startsWith(typed));
      if (match) e.target.value = match;
    }
    return;
  }

  if (state.sel) {
    if (e.key === 'Tab') { trapFocus(layers.querySelector('.modal'), e); return; }
    if (key === 'arrowright') stepProject(1);
    if (key === 'arrowleft') stepProject(-1);
    return;
  }

  if (tag === 'input' || tag === 'textarea') return;
  if (key === 'arrowright') stepPage(1);
  if (key === 'arrowleft') stepPage(-1);
});

window.addEventListener('hashchange', () => {
  const had = state.sel;
  if (!readHash()) return;
  paint();
  if (state.sel !== had) renderLayers();
});

document.getElementById('btn-pal').addEventListener('click', openPalette);
document.getElementById('btn-term').addEventListener('click', toggleTerm);
document.getElementById('btn-theme').addEventListener('click', () => {
  state.theme = state.theme === 'tinta' ? 'papel' : 'tinta';
  applyTheme();
  renderLayers();
});
document.getElementById('btn-prev').addEventListener('click', () => stepPage(-1));
document.getElementById('btn-next').addEventListener('click', () => stepPage(1));

try {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === 'tinta' || saved === 'papel') state.theme = saved;
} catch (e) {}

applyTheme();
readHash();
paint();
if (state.sel) renderLayers();
</script>
</body>
</html>
